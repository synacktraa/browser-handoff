[project]
name = "browser-handoff"
version = "0.1.0"
description = "Human-in-the-loop fallback for browser automation via CDP-based streaming when automation gets blocked"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "synacktra", email = "synacktra.work@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["browser", "automation", "playwright", "handoff", "captcha", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "playwright>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/synacktraa/browser-handoff"
Repository = "https://github.com/synacktraa/browser-handoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_handoff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
