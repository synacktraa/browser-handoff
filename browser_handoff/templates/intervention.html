<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Handoff - Human Intervention</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
          background: #0a0a0a;
          color: #e0e0e0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 20px;
      }

      #browser-window {
          width: {{ viewport_width }}px;
          max-width: calc(100vw - 40px);
          background: #2a2a2a;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      }

      #toolbar {
          height: 50px;
          background: linear-gradient(to bottom, #3a3a3a, #2e2e2e);
          border-bottom: 1px solid #1a1a1a;
          display: flex;
          align-items: center;
          padding: 0 16px;
          gap: 10px;
          flex-shrink: 0;
      }

      .browser-icon {
          font-size: 18px;
          margin-right: 8px;
          opacity: 0.7;
      }

      .nav-buttons {
          display: flex;
          gap: 4px;
      }

      .nav-button {
          width: 32px;
          height: 32px;
          background: #444;
          border: 1px solid #555;
          border-radius: 4px;
          color: #e0e0e0;
          cursor: pointer;
          font-size: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.2s;
      }

      .nav-button:hover:not(:disabled) {
          background: #555;
          border-color: #666;
      }

      .nav-button:active:not(:disabled) {
          background: #333;
      }

      .nav-button:disabled {
          background: #2a2a2a;
          border-color: #333;
          color: #666;
          cursor: not-allowed;
          opacity: 0.5;
      }

      #task-info {
          flex: 1;
          margin-left: 12px;
          padding: 6px 12px;
          background: #1a1a1a;
          border-radius: 4px;
          font-size: 13px;
          color: #bbb;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }

      #task-info .label {
          color: #888;
          margin-right: 6px;
      }

      #status {
          margin-left: 12px;
          font-size: 12px;
          display: flex;
          align-items: center;
          gap: 6px;
      }

      .status-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
      }

      .connected { color: #4caf50; }
      .connected .status-dot { background: #4caf50; }
      .connecting { color: #ff9800; }
      .connecting .status-dot { background: #ff9800; }
      .completed { color: #4caf50; }
      .completed .status-dot { background: #4caf50; }

      #stream-container {
          width: {{ viewport_width }}px;
          height: {{ viewport_height }}px;
          max-width: 100%;
          max-height: calc(100vh - 120px);
          background: #000;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
      }

      #stream {
          width: 100%;
          height: 100%;
          object-fit: contain;
          cursor: default;
          user-select: none;
          display: block;
          overscroll-behavior: none;
          touch-action: none;
      }

      #completion-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 10;
          animation: fadeIn 0.3s ease-in-out;
      }

      #completion-overlay.show {
          display: flex;
      }

      @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
      }

      .completion-checkmark {
          font-size: 80px;
          margin-bottom: 24px;
          animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes scaleIn {
          from { transform: scale(0); }
          to { transform: scale(1); }
      }

      .completion-title {
          font-size: 32px;
          font-weight: 600;
          color: #4caf50;
          margin-bottom: 16px;
          text-align: center;
      }

      .completion-reason {
          font-size: 16px;
          color: #bbb;
          margin-bottom: 32px;
          text-align: center;
          max-width: 80%;
          line-height: 1.5;
      }

      .completion-message {
          font-size: 14px;
          color: #888;
          text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="browser-window">
      <div id="toolbar">
        <span class="browser-icon">&#x1f310;</span>

        <div class="nav-buttons">
          <button id="reload" class="nav-button" title="Reload">&#x27f3;</button>
        </div>

        <div id="task-info"><span class="label">Task:</span>{{ reason }}</div>

        <div id="status">
          <span class="connecting"
            ><span class="status-dot"></span>Connecting...</span
          >
        </div>
      </div>

      <div id="stream-container">
        <img id="stream" alt="Browser Stream" draggable="false" />
        <div id="completion-overlay">
          <div class="completion-checkmark">&#x2705;</div>
          <div class="completion-title">Task Completed</div>
          <div class="completion-reason" id="completion-reason-text"></div>
          <div class="completion-message">You may close this window</div>
        </div>
      </div>
    </div>

    <script>
      const ACCESS_TOKEN = "{{ access_token }}";

      const stream = document.getElementById('stream');
      const statusEl = document.getElementById('status').querySelector('span');
      const completionOverlay = document.getElementById('completion-overlay');
      const completionReasonText = document.getElementById('completion-reason-text');

      // Determine WebSocket protocol based on page protocol
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws?t=${ACCESS_TOKEN}`);
      ws.binaryType = 'blob';
      let mouseThrottle = null;

      // Track stream connection
      let streamConnected = false;

      function updateStatus() {
          if (streamConnected) {
              statusEl.className = 'connected';
              statusEl.innerHTML = '<span class="status-dot"></span>Connected';
          } else {
              statusEl.className = 'connecting';
              statusEl.innerHTML = '<span class="status-dot"></span>Connecting...';
          }
      }

      // Latest-frame-wins client-side. We may receive frames faster than
      // the screen can paint; only the newest unrendered frame matters.
      // requestAnimationFrame coalesces multiple receive ticks into a
      // single paint per refresh cycle.
      let pendingBlob = null;
      let rafScheduled = false;
      let currentObjectUrl = null;

      function renderPendingFrame() {
          rafScheduled = false;
          if (!pendingBlob) return;
          const url = URL.createObjectURL(pendingBlob);
          pendingBlob = null;
          const previous = currentObjectUrl;
          currentObjectUrl = url;
          stream.src = url;
          if (previous) URL.revokeObjectURL(previous);
          if (!streamConnected) {
              streamConnected = true;
              updateStatus();
          }
      }

      ws.onopen = () => console.log('WS Connected');
      ws.onerror = (e) => console.error('WS Error:', e);

      ws.onclose = () => {
          streamConnected = false;
          updateStatus();
      };

      ws.onmessage = (event) => {
          if (typeof event.data !== 'string') {
              // Binary frame: drop any unrendered older frame, keep newest.
              pendingBlob = event.data;
              if (!rafScheduled) {
                  rafScheduled = true;
                  requestAnimationFrame(renderPendingFrame);
              }
              return;
          }
          const message = JSON.parse(event.data);
          if (message.type === 'task_completed') {
              showCompletionOverlay(message.reason);
          } else if (message.type === 'copy_response') {
              // The remote selection comes back here so we can drop it onto
              // the operator's local clipboard. Failure (no permission, no
              // selection) is silent — operator can retry.
              if (message.text && navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(message.text).catch(() => {});
              }
          }
      };

      function showCompletionOverlay(reason) {
          completionReasonText.textContent = reason;
          completionOverlay.classList.add('show');
          statusEl.className = 'completed';
          statusEl.innerHTML = '<span class="status-dot"></span>Completed';
      }

      function send(data) {
          if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify(data));
          }
      }

      document.getElementById('reload').onclick = () => send({type: 'navigate', action: 'reload'});

      function getCoords(e) {
          const rect = stream.getBoundingClientRect();

          // Use the actual frame dimensions, not VIEWPORT_WIDTH/HEIGHT. The
          // template values can disagree with what CDP actually captures
          // (Xvfb display size, window decorations, devicePixelRatio, or
          // Page.startScreencast clamping). naturalWidth/Height is the truth.
          const naturalW = stream.naturalWidth;
          const naturalH = stream.naturalHeight;
          if (!naturalW || !naturalH) return null;

          const containerAspect = rect.width / rect.height;
          const imageAspect = naturalW / naturalH;

          let imageWidth, imageHeight, offsetX, offsetY;
          if (imageAspect > containerAspect) {
              imageWidth = rect.width;
              imageHeight = rect.width / imageAspect;
              offsetX = 0;
              offsetY = (rect.height - imageHeight) / 2;
          } else {
              imageHeight = rect.height;
              imageWidth = rect.height * imageAspect;
              offsetX = (rect.width - imageWidth) / 2;
              offsetY = 0;
          }

          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          if (x < offsetX || x > offsetX + imageWidth ||
              y < offsetY || y > offsetY + imageHeight) {
              return null; // padding area
          }

          // Map displayed-pixel → frame-pixel. Input.dispatchMouseEvent
          // expects page CSS pixels; with devicePixelRatio=1 (default Xvfb),
          // frame pixels equal viewport CSS pixels, so this is what CDP wants.
          return {
              x: Math.round((x - offsetX) * (naturalW / imageWidth)),
              y: Math.round((y - offsetY) * (naturalH / imageHeight))
          };
      }

      // Suppress native image drag — without this, the browser swallows
      // mousemoves into its drag-and-drop machinery and the remote sees a
      // click, never a drag-select.
      stream.ondragstart = (e) => e.preventDefault();

      stream.onmousedown = (e) => {
          // preventDefault on the left button so the local browser doesn't try
          // to start a selection / drag on the <img> itself — all movement
          // semantics belong to the remote.
          if (e.button === 0) e.preventDefault();
          const coords = getCoords(e);
          if (!coords) return; // Ignore clicks on padding
          send({type: 'mouse', action: 'mousedown', x: coords.x, y: coords.y, button: e.button, clickCount: e.detail || 1});
      };

      stream.onmouseup = (e) => {
          const coords = getCoords(e);
          if (!coords) return; // Ignore clicks on padding
          send({type: 'mouse', action: 'mouseup', x: coords.x, y: coords.y, button: e.button, clickCount: e.detail || 1});
      };

      stream.onmousemove = (e) => {
          // Throttle mouse move events to ~60 FPS
          if (mouseThrottle) return;

          mouseThrottle = setTimeout(() => {
              mouseThrottle = null;
          }, 16);

          const coords = getCoords(e);
          if (!coords) return; // Ignore moves on padding
          send({type: 'mouse', action: 'mousemove', x: coords.x, y: coords.y});
      };

      stream.onwheel = (e) => {
          e.preventDefault();
          const coords = getCoords(e);
          if (!coords) return; // Ignore wheel on padding
          send({type: 'mouse', action: 'wheel', x: coords.x, y: coords.y, deltaX: e.deltaX, deltaY: e.deltaY});
      };

      // Clipboard relay: the remote browser has its own (isolated) clipboard,
      // so ctrl/cmd + v / c are intercepted here. Paste reads the operator's
      // local clipboard and sends the text; copy asks the server for the
      // remote selection and writes it back to the local clipboard.
      function isClipboardShortcut(e) {
          if (!(e.ctrlKey || e.metaKey)) return null;
          // Prefer e.code (physical key) so non-Latin layouts (e.g. Cyrillic
          // 'м' on the V key) still trigger the intercept. Fall back to e.key
          // for environments where code isn't populated.
          const code = e.code || '';
          if (code === 'KeyV') return 'v';
          if (code === 'KeyC') return 'c';
          const k = (e.key || '').toLowerCase();
          return (k === 'v' || k === 'c') ? k : null;
      }

      document.onkeydown = async (e) => {
          const clip = isClipboardShortcut(e);
          if (clip === 'v') {
              e.preventDefault();
              try {
                  const text = await navigator.clipboard.readText();
                  if (text) send({type: 'paste', text});
              } catch (err) {
                  // Permission denied / unavailable — fall back to the raw key
                  // so behavior matches today's broken-but-familiar baseline.
                  send({type: 'keyboard', action: 'keydown', key: e.key, code: e.code, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey});
              }
              return;
          }
          if (clip === 'c') {
              e.preventDefault();
              send({type: 'copy_request'});
              return;
          }
          send({type: 'keyboard', action: 'keydown', key: e.key, code: e.code, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey});
      };

      document.onkeyup = (e) => {
          if (isClipboardShortcut(e)) {
              e.preventDefault();
              return;
          }
          send({type: 'keyboard', action: 'keyup', key: e.key, code: e.code, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, meta: e.metaKey});
      };

      stream.oncontextmenu = (e) => e.preventDefault();
    </script>
  </body>
</html>
